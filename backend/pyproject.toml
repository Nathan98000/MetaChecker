[project]
name = "metaaudit-backend"
version = "0.1.0"
description = "Meta-analysis audit tool — local backend (API + worker)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "pymupdf",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
